<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Executive Health Dashboard | Full Report</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: radial-gradient(circle at center, #064e3b 0%, #022c22 100%); color: white; min-height: 100vh; overflow-x: hidden; }
    #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; pointer-events: none; }
    .glass-nav { background: rgba(0, 0, 0, 0.2); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
    .nav-link { color: rgba(255,255,255,0.5); font-weight: 600; font-size: 0.75rem; transition: 0.3s; letter-spacing: 0.1em; }
    .nav-link:hover, .nav-active { color: #10b981; }
    .metric-card { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.08); border-radius: 1.5rem; padding: 1.5rem; }
    .white-card { background: rgba(255, 255, 255, 0.98); border-radius: 1.5rem; padding: 1.5rem; color: #1e293b; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; }
    .month-btn { width: 100%; text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 700; transition: 0.3s; color: rgba(255,255,255,0.3); border-radius: 0.5rem; text-transform: uppercase; margin-bottom: 2px; }
    .month-btn.active { color: white; background: #10b981; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .growth-badge { padding: 2px 8px; border-radius: 99px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; }
    .growth-up { background: rgba(16, 185, 129, 0.15); color: #10b981; }
    .growth-down { background: rgba(239, 68, 68, 0.15); color: #ef4444; }
    .procedure-item { border-bottom: 1px solid rgba(0,0,0,0.03); padding: 8px 0; display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
    .chart-container { position: relative; flex-grow: 1; min-height: 200px; width: 100%; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: #10b981; color: white; padding: 12px 24px; border-radius: 12px; font-weight: 800; font-size: 12px; transition: 0.5s; z-index: 1000; }
    #toast.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <div id="toast">LINK COPIED TO CLIPBOARD</div>
  <canvas id="bg-canvas"></canvas>

  <nav class="glass-nav sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-9 h-9 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg"><svg class="text-white w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-width="2.5"/></svg></div>
        <h1 class="font-extrabold text-sm tracking-tighter uppercase text-white">Executive Dashboard</h1>
      </div>
      <div class="hidden md:flex items-center gap-10">
        <a href="home.html" class="nav-link">HOME</a>
        <a href="dashboard.html" class="nav-link">RECORDS</a>
        <a href="reports.html" class="nav-link nav-active">REPORTS</a>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="logout()" class="text-[10px] font-extrabold text-red-400 uppercase border border-red-400/30 px-4 py-2 rounded-lg hover:bg-red-400 hover:text-white transition">Logout</button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 lg:p-8">
    <div id="loadingState" class="text-center py-24 text-emerald-400 font-light animate-pulse uppercase text-xs">Architecting Data...</div>

    <div id="reportContent" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-2 space-y-6">
             <div class="bg-black/20 p-4 rounded-2xl border border-white/5">
                <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-2 text-center">Daily Filter</p>
                <input type="date" id="dateSelector" onchange="handleDateChange(this.value)" class="bg-transparent border border-white/10 rounded-lg p-2 text-xs w-full text-white focus:outline-none focus:border-emerald-500">
             </div>
            <div id="monthPicker" class="space-y-1 bg-black/20 p-2 rounded-2xl border border-white/5 max-h-[40vh] overflow-y-auto custom-scrollbar"></div>
            <div class="metric-card bg-emerald-900/40 border-emerald-500/30 text-center">
                <p class="text-[9px] font-bold text-emerald-400 uppercase tracking-widest mb-1">VIP Census</p>
                <h2 id="vipCount" class="text-4xl font-extrabold">0</h2>
            </div>
        </div>

        <div class="lg:col-span-10 space-y-8">
            <div class="flex items-center gap-3">
                <div id="filterSummary" class="bg-emerald-500/20 border border-emerald-500/30 px-4 py-1.5 rounded-full text-[10px] font-bold tracking-[0.2em] text-emerald-400 uppercase">Overall Performance</div>
                <div class="h-[1px] flex-grow bg-white/10"></div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="lg:col-span-2 white-card">
                    <p class="text-[11px] font-extrabold text-slate-400 uppercase mb-4 tracking-wider">Revenue Performance (Current vs Prev Year)</p>
                    <div class="chart-container"><canvas id="revLineChart"></canvas></div>
                </div>
                <div class="flex flex-col gap-6">
                    <div class="metric-card flex-1">
                        <div class="flex justify-between items-start mb-4"><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Revenue</p><div id="revGrowthBadge"></div></div>
                        <h2 id="valCurrentYear" class="text-3xl font-extrabold">₱0</h2>
                        <p class="text-[10px] text-slate-500 mt-1">vs <span id="valPrevYearVal" class="font-bold">₱0</span> (YoY)</p>
                    </div>
                    <div class="metric-card flex-1">
                        <div class="flex justify-between items-start mb-4"><p class="text-[10px] font-bold text-slate-500 uppercase tracking-widest">Census</p><div id="cenGrowthBadge"></div></div>
                        <h2 id="valCensusCurrent" class="text-3xl font-extrabold">0</h2>
                        <p class="text-[10px] text-slate-500 mt-1">vs <span id="valCensusPrevVal" class="font-bold">0</span> (YoY)</p>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="white-card">
                    <p class="text-[11px] font-extrabold text-slate-400 uppercase mb-4 tracking-wider border-b pb-2">Top 10 Procedures</p>
                    <div id="procedureList" class="space-y-1"></div>
                </div>
                <div class="white-card">
                    <p class="text-[11px] font-extrabold text-slate-400 uppercase mb-4 tracking-wider border-b pb-2">HMO Performance</p>
                    <div class="overflow-y-auto max-h-[250px]">
                        <table class="w-full text-[11px]">
                            <tbody id="hmoTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
  </main>

  <script>
    const db = window.supabase.createClient('https://xpdtzvxjlguhcxkgowsg.supabase.co','sb_publishable_KOm1sD7eOBpbJ_CiYtKL8w_RykN3krN');
    let globalData = [], latestYear, prevYear, selectedMonthIndex = null, selectedDate = null;
    const monthsShort = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    const monthsFull = ["January","February","March","April","May","June","July","August","September","October","November","December"];

    async function init() {
        const { data } = await db.from('patient_records').select('*');
        globalData = data || [];
        const years = [...new Set(globalData.map(r => new Date(r.date).getFullYear()))].sort((a,b) => b-a);
        latestYear = years[0] || new Date().getFullYear();
        prevYear = latestYear - 1;

        renderMonthPicker(); 
        updateDashboard();
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('reportContent').classList.remove('hidden');
    }

    function updateDashboard() {
        const filterByYear = (yr) => globalData.filter(r => {
            const d = new Date(r.date);
            const matchesYear = d.getFullYear() === yr;
            const matchesMonth = selectedMonthIndex === null || d.getMonth() === selectedMonthIndex;
            const matchesDay = !selectedDate || d.toISOString().split('T')[0] === selectedDate;
            return matchesYear && matchesMonth && matchesDay;
        });

        const curData = filterByYear(latestYear);
        const preData = filterByYear(prevYear);

        const revC = curData.reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);
        const revP = preData.reduce((a, r) => a + (parseFloat(r.amount) || 0), 0);
        
        document.getElementById('valCurrentYear').innerText = `₱${revC.toLocaleString()}`;
        document.getElementById('valPrevYearVal').innerText = `₱${revP.toLocaleString()}`;
        document.getElementById('valCensusCurrent').innerText = curData.length.toLocaleString();
        document.getElementById('valCensusPrevVal').innerText = preData.length.toLocaleString();
        document.getElementById('vipCount').innerText = curData.filter(r => r.guarantor?.toLowerCase() === 'vip').length;

        renderHmoTable(curData);
        renderTopLists(curData);
        renderMainChart(selectedMonthIndex);
    }

    function renderMainChart(mIndex) {
        Chart.helpers.each(Chart.instances, (i) => i.destroy());
        const ctx = document.getElementById('revLineChart');
        
        let labels = monthsShort;
        let curTrend, preTrend;

        if(mIndex === null) {
            labels = monthsShort;
            curTrend = monthsShort.map((_, i) => globalData.filter(r => new Date(r.date).getFullYear() === latestYear && new Date(r.date).getMonth() === i).reduce((a,r) => a + (parseFloat(r.amount) || 0), 0));
            preTrend = monthsShort.map((_, i) => globalData.filter(r => new Date(r.date).getFullYear() === prevYear && new Date(r.date).getMonth() === i).reduce((a,r) => a + (parseFloat(r.amount) || 0), 0));
        } else {
            const days = new Date(latestYear, mIndex + 1, 0).getDate();
            labels = Array.from({length: days}, (_, i) => i+1);
            curTrend = labels.map(d => globalData.filter(r => { const dt = new Date(r.date); return dt.getFullYear() === latestYear && dt.getMonth() === mIndex && dt.getDate() === d }).reduce((a,r) => a + (parseFloat(r.amount) || 0), 0));
            preTrend = labels.map(d => globalData.filter(r => { const dt = new Date(r.date); return dt.getFullYear() === prevYear && dt.getMonth() === mIndex && dt.getDate() === d }).reduce((a,r) => a + (parseFloat(r.amount) || 0), 0));
        }

        new Chart(ctx, {
            type: 'line',
            data: {
                labels,
                datasets: [
                    { label: `${latestYear}`, data: curTrend, borderColor: '#10b981', backgroundColor: 'rgba(16, 185, 129, 0.1)', fill: true, tension: 0.4, borderWidth: 3 },
                    { label: `${prevYear}`, data: preTrend, borderColor: '#94a3b8', borderDash: [5, 5], fill: false, tension: 0.4, borderWidth: 2 }
                ]
            },
            options: { 
                responsive: true, 
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'bottom', labels: { font: { size: 10, weight: 'bold' } } } },
                scales: { y: { beginAtZero: true, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { grid: { display: false } } }
            }
        });
    }

    function renderHmoTable(data) {
        const hmo = {};
        data.filter(r => r.payment_type === 'HMO').forEach(r => {
            const n = r.guarantor || 'Other';
            if(!hmo[n]) hmo[n] = { c: 0, v: 0 };
            hmo[n].c++; hmo[n].v += (parseFloat(r.amount) || 0);
        });
        document.getElementById('hmoTableBody').innerHTML = Object.entries(hmo).sort((a,b) => b[1].v - a[1].v).map(([n,s]) => `
            <tr class="border-b border-slate-50"><td class="py-2 font-bold">${n}</td><td class="text-right font-black text-emerald-600">₱${s.v.toLocaleString()}</td></tr>
        `).join('');
    }

    function renderTopLists(data) {
        const counts = {};
        data.forEach(r => (r.procedures || []).forEach(p => counts[p] = (counts[p] || 0) + 1));
        document.getElementById('procedureList').innerHTML = Object.entries(counts).sort((a,b) => b[1]-a[1]).slice(0,10).map(([n,c]) => `
            <div class="procedure-item"><span class="font-bold text-slate-700">${n}</span><span class="text-emerald-500 font-black">${c}</span></div>
        `).join('');
    }

    function renderMonthPicker() {
        const p = document.getElementById('monthPicker'); p.innerHTML = `<button onclick="setFilter(null)" class="month-btn ${selectedMonthIndex===null?'active':''}">OVERALL VIEW</button>`;
        monthsFull.forEach((m, i) => {
            p.innerHTML += `<button onclick="setFilter(${i})" class="month-btn ${selectedMonthIndex===i?'active':''}">${m}</button>`;
        });
    }

    window.setFilter = (i) => { selectedMonthIndex = i; selectedDate = null; updateDashboard(); renderMonthPicker(); };
    window.handleDateChange = (v) => { selectedDate = v; selectedMonthIndex = null; updateDashboard(); renderMonthPicker(); };
    window.logout = () => window.location.href = "index.html";

    init();
  </script>
</body>
</html>
