<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHMC | Patient Records</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
    .fab-main { width: 60px; height: 60px; background: #4f46e5; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3); transition: all 0.3s ease; cursor: pointer; }
    .fab-main:hover { transform: translateY(-5px); background: #4338ca; }
    #entryModal { display: none; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 100; position: fixed; inset: 0; align-items: center; justify-content: center; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .phmc-card { background: white; border-radius: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; }
    .nav-active { color: #4f46e5; border-bottom: 2px solid #4f46e5; }
  </style>
</head>
<body class="min-h-screen pb-20">

  <datalist id="procedureOptions"></datalist>
  <datalist id="addonOptions"></datalist>

  <nav class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200 p-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-8">
        <h1 class="font-black text-indigo-600 tracking-tighter text-xl uppercase italic">PHMC</h1>
        <div class="hidden md:flex gap-6">
          <a href="home.html" class="text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors uppercase tracking-widest">Home</a>
          <a href="dashboard.html" class="text-sm font-bold nav-active transition-colors uppercase tracking-widest pb-1">Records</a>
          <a href="reports.html" class="text-sm font-bold text-slate-400 hover:text-indigo-600 transition-colors uppercase tracking-widest">Reports</a>
        </div>
      </div>
      <button id="logoutBtn" class="bg-slate-100 text-[10px] font-black px-4 py-2 rounded-full uppercase tracking-widest hover:bg-red-50 hover:text-red-600 transition">Logout</button>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto p-6 md:p-8">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-10">
      <div>
        <h1 class="text-4xl font-black text-slate-900 tracking-tight italic">Patient Records</h1>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Hospital Management System</p>
      </div>
      <div class="relative w-full md:w-96">
        <input type="text" id="searchInput" placeholder="Search patient, doctor, or guarantor..." class="w-full pl-6 pr-6 py-4 bg-white border border-slate-200 rounded-2xl text-sm outline-none shadow-sm focus:ring-4 focus:ring-indigo-500/10 transition-all">
      </div>
    </div>

    <div class="phmc-card overflow-hidden">
      <div class="overflow-x-auto custom-scrollbar">
        <table class="w-full text-left border-collapse min-w-[1000px]">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100">
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Date</th>
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Patient Details</th>
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Medical Services</th>
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em]">Provider</th>
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-right">Revenue</th>
              <th class="px-8 py-5 text-[10px] font-black text-slate-400 uppercase tracking-[0.2em] text-center">Actions</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody" class="divide-y divide-slate-50 bg-white">
              </tbody>
        </table>
      </div>
    </div>
  </main>

  <div id="entryModal">
    <div class="bg-white w-full max-w-2xl rounded-[2.5rem] shadow-2xl p-8 md:p-10 max-h-[90vh] overflow-y-auto custom-scrollbar relative border border-slate-200">
      <div class="flex justify-between items-center mb-8">
        <div>
            <h2 id="modalTitle" class="text-2xl font-black text-slate-900 tracking-tight italic">New Transaction</h2>
            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Entry Form</p>
        </div>
        <button onclick="toggleModal(false)" class="w-10 h-10 flex items-center justify-center bg-slate-50 text-slate-400 rounded-full hover:bg-red-50 hover:text-red-500 transition-all">✕</button>
      </div>
      
      <form id="transactionForm" class="space-y-6">
        <input type="hidden" id="f-id">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="md:col-span-2">
            <label class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-2 block">Patient Name</label>
            <input type="text" id="f-patient" required class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none focus:bg-white focus:ring-4 focus:ring-indigo-500/5 transition-all">
          </div>
          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest">Age & Gender</label>
            <div class="flex gap-2">
                <input type="number" id="f-age" required placeholder="Age" class="w-20 px-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
                <select id="f-gender" class="flex-1 px-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
                    <option value="Male">Male</option><option value="Female">Female</option>
                </select>
            </div>
          </div>
          <div>
            <label class="text-[10px] font-black text-slate-400 uppercase mb-2 block tracking-widest">Transaction Date</label>
            <input type="datetime-local" id="f-date" required class="w-full px-4 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
          </div>
        </div>

        <div class="p-6 bg-slate-50 rounded-3xl space-y-4">
            <div id="procedureContainer" class="space-y-2">
                <label class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1 block">Procedures</label>
                <div class="flex gap-2">
                  <input type="text" list="procedureOptions" required class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                  <button type="button" onclick="addProcedureRow()" class="px-4 bg-emerald-500 text-white rounded-xl font-bold hover:bg-emerald-600 transition">+</button>
                </div>
            </div>

            <div id="addonContainer" class="space-y-2 pt-4 border-t border-slate-200">
                <label class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1 block">Add-ons (Optional)</label>
                <div class="flex gap-2">
                  <input type="text" list="addonOptions" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">
                  <button type="button" onclick="handleAddOnRow()" class="px-4 bg-blue-500 text-white rounded-xl font-bold hover:bg-blue-600 transition">+</button>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Attending Physician</label>
                <input type="text" id="f-doctor" placeholder="Dr. Name" required class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Payment Method</label>
                <select id="f-payment" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
                    <option>Cash</option><option>HMO</option><option>Company</option>
                </select>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1 block">Guarantor</label>
                <input type="text" id="f-guarantor" placeholder="N/A" class="w-full px-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold outline-none">
            </div>
            <div>
                <label class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1 block">Total Amount (₱)</label>
                <input type="number" step="0.01" id="f-amount" placeholder="0.00" required class="w-full px-5 py-4 bg-emerald-50 border border-emerald-100 rounded-2xl text-sm font-black text-emerald-700 outline-none">
            </div>
        </div>

        <button type="submit" id="saveBtn" class="w-full py-5 bg-indigo-600 text-white font-black rounded-2xl uppercase tracking-widest shadow-xl shadow-indigo-200 hover:bg-indigo-700 transition-all">Update Database</button>
      </form>
    </div>
  </div>

  <div class="fixed bottom-8 right-8 flex items-center group">
    <span class="bg-slate-800 text-white text-[10px] font-black px-4 py-2 rounded-lg mr-4 opacity-0 group-hover:opacity-100 transition-all uppercase tracking-widest">Add New Record</span>
    <div class="fab-main" onclick="toggleModal(true)">
      <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
    </div>
  </div>

  <script>
    (function() {
      const supabase = window.supabase.createClient('https://xpdtzvxjlguhcxkgowsg.supabase.co', 'sb_publishable_KOm1sD7eOBpbJ_CiYtKL8w_RykN3krN');
      let allRecords = [];

      supabase.auth.onAuthStateChange((event, session) => {
        if (!session) window.location.replace("index.html");
        else { fetchRecords(); }
      });

      // IMPROVED: Combined Dropdown Logic
      async function fetchDropdowns(records) {
        // 1. Get from Master Tables
        const { data: pData } = await supabase.from('procedures').select('name');
        const { data: aData } = await supabase.from('addons').select('name');
        
        // 2. Get from existing data in patient_records to ensure everything is captured
        const existingProcs = new Set((pData || []).map(x => x.name));
        const existingAddons = new Set((aData || []).map(x => x.name));

        records.forEach(r => {
            if (r.procedures) r.procedures.forEach(p => existingProcs.add(p));
            if (r.add_on) {
                const addons = Array.isArray(r.add_on) ? r.add_on : [r.add_on];
                addons.forEach(a => existingAddons.add(a));
            }
        });

        document.getElementById('procedureOptions').innerHTML = Array.from(existingProcs).sort().map(x => `<option value="${x}">`).join('');
        document.getElementById('addonOptions').innerHTML = Array.from(existingAddons).sort().map(x => `<option value="${x}">`).join('');
      }

      async function fetchRecords() {
        const { data } = await supabase.from('patient_records').select('*').order('date', { ascending: false });
        if (data) { 
            allRecords = data; 
            renderTable(data); 
            fetchDropdowns(data); // Call dropdown refresh with new record data
        }
      }

      function renderTable(records) {
        const tbody = document.getElementById('recordsTableBody');
        tbody.innerHTML = records.map(r => {
          const typeColor = r.payment_type === 'Cash' ? 'text-orange-500 bg-orange-50' : r.payment_type === 'HMO' ? 'text-indigo-500 bg-indigo-50' : 'text-purple-500 bg-purple-50';
          const procs = r.procedures.map(p => `<span class="inline-block px-2 py-1 mr-1 mb-1 bg-slate-100 text-slate-600 rounded-lg text-[9px] font-black border border-slate-200 uppercase">${p}</span>`).join('');
          const addons = Array.isArray(r.add_on) ? r.add_on.map(a => `<div class="text-[9px] font-black text-blue-500 uppercase tracking-tighter">+ ${a}</div>`).join('') : '';

          return `<tr class="hover:bg-slate-50/50 transition-colors">
            <td class="px-8 py-6">
                <div class="text-xs font-black text-slate-900">${new Date(r.date).toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'})}</div>
                <div class="text-[10px] text-slate-400 font-bold uppercase">${new Date(r.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
            </td>
            <td class="px-8 py-6">
              <div class="font-black text-slate-900 text-sm italic">${r.patient_name}</div>
              <div class="flex items-center gap-2 mt-1">
                <span class="text-[10px] text-slate-400 font-black uppercase tracking-tighter">${r.age}Y • ${r.gender}</span>
                <span class="px-2 py-0.5 rounded-full text-[8px] font-black uppercase tracking-widest ${typeColor}">${r.payment_type}</span>
              </div>
            </td>
            <td class="px-8 py-6">
                <div class="flex flex-wrap">${procs}</div>
                <div class="mt-1">${addons}</div>
            </td>
            <td class="px-8 py-6">
              <div class="text-xs font-black text-slate-700">DR. ${r.doctor_name.toUpperCase()}</div>
              <div class="text-[9px] text-slate-400 font-bold mt-1 uppercase tracking-widest">G: ${r.guarantor || 'NONE'}</div>
            </td>
            <td class="px-8 py-6 text-right">
                <div class="text-sm font-black text-emerald-600 italic">₱${parseFloat(r.amount).toLocaleString(undefined, {minimumFractionDigits: 2})}</div>
            </td>
            <td class="px-8 py-6">
              <div class="flex justify-center gap-4">
                <button onclick='window.editRecord(${JSON.stringify(r).replace(/'/g, "&apos;")})' class="text-indigo-600 hover:text-indigo-800 text-[10px] font-black uppercase tracking-widest">Edit</button>
                <button onclick="window.deleteRecord('${r.id}')" class="text-slate-300 hover:text-red-500 text-[10px] font-black uppercase tracking-widest transition-colors">Delete</button>
              </div>
            </td>
          </tr>`;
        }).join('');
      }

      // Search Logic
      document.getElementById('searchInput').onkeyup = (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = allRecords.filter(r => 
            r.patient_name.toLowerCase().includes(term) || 
            r.doctor_name.toLowerCase().includes(term) ||
            (r.guarantor && r.guarantor.toLowerCase().includes(term))
        );
        renderTable(filtered);
      };

      // Modal Logic
      window.editRecord = (r) => {
        document.getElementById('modalTitle').innerText = "Edit Record";
        document.getElementById('f-id').value = r.id;
        document.getElementById('f-patient').value = r.patient_name;
        document.getElementById('f-age').value = r.age;
        document.getElementById('f-gender').value = r.gender;
        document.getElementById('f-date').value = r.date.slice(0,16);
        document.getElementById('f-payment').value = r.payment_type;
        document.getElementById('f-doctor').value = r.doctor_name;
        document.getElementById('f-amount').value = r.amount;
        document.getElementById('f-guarantor').value = r.guarantor === 'N/A' ? '' : r.guarantor;
        
        const pContainer = document.getElementById('procedureContainer');
        pContainer.innerHTML = '<label class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1 block">Procedures</label>';
        r.procedures.forEach((p, i) => {
          const div = document.createElement('div'); div.className = "flex gap-2 mt-2";
          div.innerHTML = `<input type="text" list="procedureOptions" value="${p}" required class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">${i === 0 ? `<button type="button" onclick="addProcedureRow()" class="px-4 bg-emerald-500 text-white rounded-xl font-bold">+</button>` : `<button type="button" onclick="this.parentElement.remove()" class="px-4 bg-red-50 text-red-500 rounded-xl font-bold">×</button>`}`;
          pContainer.appendChild(div);
        });

        const aContainer = document.getElementById('addonContainer');
        aContainer.innerHTML = '<label class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1 block">Add-ons (Optional)</label>';
        const addOnList = Array.isArray(r.add_on) ? r.add_on : [];
        if (addOnList.length === 0) {
            handleAddOnRow();
        } else {
            addOnList.forEach((a, i) => {
                const div = document.createElement('div'); div.className = "flex gap-2 mt-2";
                div.innerHTML = `<input type="text" list="addonOptions" value="${a}" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none">${i === 0 ? `<button type="button" onclick="handleAddOnRow()" class="px-4 bg-blue-500 text-white rounded-xl font-bold">+</button>` : `<button type="button" onclick="this.parentElement.remove()" class="px-4 bg-red-50 text-red-500 rounded-xl font-bold">×</button>`}`;
                aContainer.appendChild(div);
            });
        }
        toggleModal(true);
      };

      window.deleteRecord = async (id) => {
        if (confirm("Permanently delete this record?")) {
          await supabase.from('patient_records').delete().eq('id', id);
          fetchRecords();
        }
      };

      window.toggleModal = (show) => {
        const modal = document.getElementById('entryModal');
        modal.style.display = show ? 'flex' : 'none';
        if (!show) { 
            document.getElementById('transactionForm').reset(); 
            document.getElementById('f-id').value = ''; 
        } else if (!document.getElementById('f-id').value) {
            document.getElementById('modalTitle').innerText = "New Transaction";
            const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('f-date').value = now.toISOString().slice(0,16);
            document.getElementById('procedureContainer').innerHTML = '<label class="text-[10px] font-black text-emerald-600 uppercase tracking-widest mb-1 block">Procedures</label><div class="flex gap-2 mt-2"><input type="text" list="procedureOptions" required class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none"><button type="button" onclick="addProcedureRow()" class="px-4 bg-emerald-500 text-white rounded-xl font-bold">+</button></div>';
            document.getElementById('addonContainer').innerHTML = '<label class="text-[10px] font-black text-blue-600 uppercase tracking-widest mb-1 block">Add-ons (Optional)</label><div class="flex gap-2 mt-2"><input type="text" list="addonOptions" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none"><button type="button" onclick="handleAddOnRow()" class="px-4 bg-blue-500 text-white rounded-xl font-bold">+</button></div>';
        }
      };

      window.addProcedureRow = () => {
        const div = document.createElement('div'); div.className = "flex gap-2 mt-2";
        div.innerHTML = `<input type="text" list="procedureOptions" placeholder="Select Procedure" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none"><button type="button" onclick="this.parentElement.remove()" class="px-4 bg-red-50 text-red-500 rounded-xl font-bold">×</button>`;
        document.getElementById('procedureContainer').appendChild(div);
      };

      window.handleAddOnRow = () => {
        const div = document.createElement('div'); div.className = "flex gap-2 mt-2";
        div.innerHTML = `<input type="text" list="addonOptions" placeholder="Select Add-on" class="flex-1 px-4 py-3 bg-white border border-slate-200 rounded-xl text-sm font-bold outline-none"><button type="button" onclick="this.parentElement.remove()" class="px-4 bg-red-50 text-red-500 rounded-xl font-bold">×</button>`;
        document.getElementById('addonContainer').appendChild(div);
      };

      document.getElementById('transactionForm').onsubmit = async (e) => {
        e.preventDefault();
        const id = document.getElementById('f-id').value;
        const procedures = Array.from(document.querySelectorAll('#procedureContainer input')).map(i => i.value).filter(v => v.trim());
        const add_on = Array.from(document.querySelectorAll('#addonContainer input')).map(i => i.value).filter(v => v.trim());
        
        const { data: { user } } = await supabase.auth.getUser();
        const payload = {
          date: document.getElementById('f-date').value,
          patient_name: document.getElementById('f-patient').value,
          age: parseInt(document.getElementById('f-age').value),
          gender: document.getElementById('f-gender').value,
          procedures,
          add_on,
          doctor_name: document.getElementById('f-doctor').value,
          payment_type: document.getElementById('f-payment').value,
          guarantor: document.getElementById('f-guarantor').value || 'N/A',
          amount: parseFloat(document.getElementById('f-amount').value),
          staff_email: user.email
        };

        const { error } = id ? await supabase.from('patient_records').update(payload).eq('id', id) : await supabase.from('patient_records').insert([payload]);
        if (error) alert(error.message);
        else { toggleModal(false); fetchRecords(); }
      };

      document.getElementById('logoutBtn').onclick = async () => { await supabase.auth.signOut(); window.location.replace("index.html"); };
    })();
  </script>
</body>
</html>
